<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabrica — review</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="review-page">
<header class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title">Waiting on you · <span id="count">0</span></span>
  </div>
  <div class="toolbar-row toolbar-sub">
    <!-- Issue #189: the two subscription meters. This page is where the
         Client decides whether to spend a round, and the week's own
         window is the one budget no dollar figure can show. -->
    <span id="meters"></span>
    <span id="error" hidden></span>
  </div>
</header>

<main>
  <div id="rows"></div>

  <!-- Issue #203: the tasks currently running, which is where the one
       write action this page gained - stop - can apply. Deliberately a
       separate section below the waiting-on-you list, and with its own
       count: a running task is the opposite of one waiting on the
       Client, and folding the two together would quietly change what
       "waiting on you" means (see record-view.ts's getRunningRows). -->
  <section id="running-section" hidden>
    <h2 class="section-title">Running · <span id="running-count">0</span></h2>
    <div id="running"></div>
  </section>
</main>

<!-- See index.html's own note: every page loads the banner strip. -->
<script src="/banner.js"></script>
<script src="/review.js"></script>
</body>
</html>
