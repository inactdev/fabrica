<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fabrica — task</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title">Event stream · <span id="count">0</span> events</span>
    <div class="filters">
      <button class="filter-btn" data-filter="all">All</button>
      <button class="filter-btn" data-filter="worker">Worker</button>
      <button class="filter-btn" data-filter="system">System</button>
      <button class="filter-btn" data-filter="errors">Errors</button>
      <button class="filter-btn" id="tail-toggle">Tail: on</button>
    </div>
  </div>
  <div class="toolbar-row toolbar-sub">
    <span class="toolbar-left-group">
      <a class="back-link" href="/">← Tasks</a>
      <span id="task-title"></span>
      <span id="task-state"></span>
    </span>
    <span id="error" hidden></span>
  </div>
</header>

<main>
  <div class="page-body">
    <div id="transcript"></div>
  </div>
  <aside class="sidebar" id="task-detail"></aside>
</main>

<script src="/task.js"></script>
</body>
</html>
