<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Issue #203: without this, a phone renders the page at a notional
     desktop width and scales it down, so the stacked-card layout below
     tablet width would never be the one a phone actually gets. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabrica — live view</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title">Tasks · <span id="count">0</span></span>
    <a class="back-link" href="/history">History</a>
  </div>
  <div class="toolbar-row toolbar-sub">
    <span id="spend">Loading…</span>
    <span id="error" hidden></span>
  </div>
  <!-- Issue #204: the skip rules' shadow counts. Hidden until the
       server sends a line (it sends null when no project has a rules
       file), so an opted-out record home shows no empty row. -->
  <div class="toolbar-row toolbar-sub">
    <span id="shadow" hidden></span>
  </div>
</header>

<main>
  <!-- One DOM, two layouts (style.css): a table with this header pinned
       above tablet width, one stacked card per task below it, where the
       header is hidden and every cell prints its own data-label instead.
       The labels here and the cells' data-label attributes in app.js are
       the same strings on purpose. -->
  <div class="task-table">
    <div class="task-head" id="task-head" hidden>
      <div class="head-cell">state</div>
      <div class="head-cell">task</div>
      <div class="head-cell">project</div>
      <div class="head-cell">worker · model</div>
      <div class="head-cell">network policy</div>
      <div class="head-cell">trigger</div>
      <div class="head-cell">started</div>
      <div class="head-cell">duration</div>
      <div class="head-cell">cost</div>
      <div class="head-cell">checks</div>
      <div class="head-cell">delivery</div>
      <div class="head-cell">confidence</div>
    </div>
    <div id="tasks"></div>
  </div>
</main>

<!-- The banner strip - a stale server, or an unreadable projects.toml.
     Loaded by every page, and self-contained: see public/banner.js. -->
<script src="/banner.js"></script>
<script src="/app.js"></script>
</body>
</html>
