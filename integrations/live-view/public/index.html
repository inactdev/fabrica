<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fabrica — live view</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title">Tasks · <span id="count">0</span></span>
    <div class="filters">
      <button class="filter-btn" data-filter="all">All</button>
      <button class="filter-btn" data-filter="open">Open</button>
      <button class="filter-btn" data-filter="history">History</button>
    </div>
  </div>
  <div class="toolbar-row toolbar-sub">
    <span id="spend">Loading…</span>
    <span id="error" hidden></span>
  </div>
</header>

<main>
  <div id="tasks"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
