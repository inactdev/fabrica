# CONTRACT rule 9's CI-visible gate. CI can only see this repository, not
# ~/.fabrica, so it can't read delivery.outcome directly — src/foreman/do.ts
# renames a violating task's branch from fabrica/<taskId> to
# fabrica/discarded/<taskId> instead, and this workflow fails on that name.
# See src/foreman/README.md's "Rule 9: blocked, not discarded" for why a
# branch rename was chosen over a marker file left in the tree.
#
# A failing check here does not, by itself, block a merge — GitHub only
# enforces that once this workflow's job is marked a required status check
# in the repository's branch protection settings, a manual setting this
# file cannot turn on for you.
#
# The job below deliberately has no job-level `if`. A job an `if` skips
# reports a "skipped" conclusion, and whether GitHub treats "skipped" as
# passing for a *required* status check is a known trap, not a documented
# guarantee. So the job always runs on every pull_request, and the branch
# name is decided inside the one step instead — every run reports a real
# pass or fail, never a skip.
name: rule9-gate

on:
  push:
    branches:
      - "fabrica/discarded/**"
  pull_request:

jobs:
  block-undeclared-gate-change:
    runs-on: ubuntu-latest
    steps:
      - name: Block merge — undeclared gate change (CONTRACT rule 9)
        env:
          # github.head_ref is only set for pull_request events; push is
          # already filtered to fabrica/discarded/** by the trigger above,
          # so github.ref_name covers that case.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" == fabrica/discarded/* ]]; then
            echo "::error::This branch's work touched the project's own checks (CONTRACT rule 9) without declaring the change. Fabrica renamed it to $BRANCH instead of merging it silently — the work is not lost, it is committed right here. Only the Client may review it and deliberately override this check to merge it."
            exit 1
          fi
          echo "No rule 9 violation - branch is $BRANCH."
