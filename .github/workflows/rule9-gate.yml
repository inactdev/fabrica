# CONTRACT rule 9's CI-visible gate. Reads the pull request's changed-file
# list via the GitHub API for a touched protected path, rather than
# trusting any mark Fabrica itself writes about the violation. Fabrica's
# own detection (gate-changes.ts) stays in place and still records the
# outcome honestly in the delivery - but that is detection, not
# enforcement. Diffing the PR needs nothing from Fabrica, so it works the
# same way for a human contributor's PR as for a Worker's, and can't be
# defeated by Fabrica misbehaving.
#
# This blocks a DECLARED gate change too, not only an undeclared one - a
# change to the thing that decides whether work passes deserves the
# Client's eyes every time, declared or not. Fabrica's own delivery record
# still tells the two apart for the Client's benefit; this check does not
# need to.
#
# ISSUE #53 - a second, separate check in this same job blocks anything
# touching `contract/` or `CONTRACT.md`. This is deliberately NOT folded
# into PROTECTED_PATHS above, and it is not a third rule-9 case, because
# it is answering a different question. PROTECTED_PATHS above exists
# because touching those paths is a violation - the thing being policed
# is grading its own homework. Touching the contract is not a violation
# at all; the Client's ruling (2026-08-05) says so explicitly - "that is
# completely fine if you think it's worth it." What's required is only
# that such a change never merges itself: it needs the Client's own eyes
# and his own merge, every time, however green the rest of the PR is.
# Same reason, different shape: one message would blur "you did something
# wrong" together with "you did something that needs a human," and an
# author reading a generic "protected path" failure has no way to tell
# which one applies or what to do next. So this is a second matching pass
# over the SAME already-fetched file list (no second API call - the
# 3000-file cap and the mid-run-push race below apply once, not twice),
# with its own PATTERNS variable and its own wording.
#
# ISSUE #96 - a third, separately-worded check below temporarily blocks
# `*.test.ts`. A test change changes what "correct" means, so until the
# examiner (github.com/inactdev/inspector#7) exists the Client reviews
# every one directly. This is deliberately crude and temporary: remove
# this pass when github.com/inactdev/fabrica/issues/96 is resolved. It
# runs AFTER the contract pass so a contract test keeps the contract
# message above, rather than being described only as a test change.
#
# That pass now defers to Inspector's own judgment where Inspector has
# one: the examiner posts a commit status named "inspector-tests" on the
# pull request's head commit (Inspector's own repository owns that
# posting - nothing here posts it, exactly as with the "inspector"
# status the inspector-stamp job below relays), and a `success` there
# clears every changed `*.test.ts` in the pull request at once. The
# judgment is per commit by design, not per file: the examiner reads the
# whole proposed change, so there is nothing per-file for this gate to
# split apart. Everything else stays red exactly as before - a failure,
# an error, a still-pending run, or no such status at all - because
# pending means something went wrong rather than "not yet": this gate
# re-runs on every push to the branch, and Inspector posts its statuses
# before it moves the branch. And a status that cannot be READ at all
# (network, rate limit, permissions, a malformed response) fails closed
# with its own message, never silently as a clearance. Both the
# clearance and the fail-closed read live only in this third pass; rule
# 9's own pass and the contract pass above are untouched by it and must
# stay that way - neither is Inspector's to clear.
#
# SAFETY-CRITICAL - read before editing this file:
#
# This job runs on `pull_request_target`, not `pull_request`, so GitHub
# reads this workflow's DEFINITION from the base branch (master), never
# from the pull request's head. A pull request can edit this file all it
# likes; the version that actually runs is still the one already on
# master, unaffected. `.github/workflows/**` is itself in PROTECTED_PATHS
# below, so an attempted edit to this file (or any other workflow) is
# exactly the kind of change that blocks the merge - the enforcement now
# protects its own definition the same way it protects check.sh.
#
# THE CONSEQUENCE, SPELLED OUT, BECAUSE IT LOOKS LIKE A BROKEN BUILD AND
# IS NOT: the pull request that changes this file fails this check
# itself, every single time - and since issue #53, so does any pull
# request touching `contract/` or `CONTRACT.md`. Since GitHub runs the
# base branch's copy of this workflow, nothing on the branch can turn
# that red check green. The branch's own new patterns are not even
# loaded; the only input the running job takes from the pull request is
# the list of filenames it changed. So there is exactly one way to make
# this check pass on such a pull request: change fewer files. NEVER take
# that way out. Deleting the protected-path change to get a green tick
# throws away the work and leaves the gate weaker than before. A red
# `block-protected-path-change` on a pull request that deliberately
# edits a protected path IS the designed outcome, and the merge is the
# Client's to make by hand, exactly as the failure messages below say.
#
# `pull_request_target` runs with elevated permissions and access to
# secrets, which is the standard, well-known disaster waiting to happen
# the moment a workflow checks out and executes code from the pull
# request it's supposed to be policing. THIS JOB MUST NEVER DO THAT. It
# only asks GitHub's API which files a PR changed and compares names - no
# `actions/checkout`, no running anything from the branch, ever. If you
# are reading this because you want to add a checkout step: stop. That is
# exactly the vulnerability class `pull_request_target` is known for, and
# it would turn this gate into the thing it exists to prevent.
#
# A failing check here does not, by itself, block a merge — GitHub only
# enforces that once this workflow's job is marked a required status check
# in the repository's branch protection settings, a manual setting this
# file cannot turn on for you.
#
# The job below deliberately has no job-level `if`. A job an `if` skips
# reports a "skipped" conclusion, and whether GitHub treats "skipped" as
# passing for a *required* status check is a known trap, not a documented
# guarantee. So the job always runs on every pull request; the path
# inspection happens inside the one step instead — every run reports a
# real pass or fail, never a skip.
#
# Known limitation (github.com/inactdev/fabrica/issues/55): this workflow
# exists only in Fabrica's own repository. Every other project Fabrica
# manages currently has no gate at all - closing that is issue #55's job,
# not this file's.
#
# Keep the job name `block-protected-path-change` exactly as it is - that
# string gets wired into the repository's required-status-check settings,
# and a rename silently breaks the protection.
name: rule9-gate

on:
  pull_request_target:

jobs:
  block-protected-path-change:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      # Issue #96's test pass asks the commit-status API for Inspector's
      # "inspector-tests" verdict on the head commit. Read-only, and the
      # same minimum scope the inspector-stamp job below declares for the
      # same endpoint - never the default token scope.
      statuses: read
    steps:
      - name: Block merge — protected path touched (CONTRACT rule 9)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The pull request's own head commit - the commit Inspector's
          # examiner posts its verdict against, and the only ref this job
          # ever reads a status for. Never a merge ref and never a
          # checked-out one, since nothing from the branch is checked out
          # here at all.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The pull request's own count of changed files, straight from
          # the event payload GitHub supplies - not from the branch, and
          # not subject to the listing cap the step checks it against.
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # Matches what src/foreman/gate-changes.ts watches today (the
          # check.sh convention) plus this workflow directory itself, so
          # the enforcement protects its own definition too. A project
          # registered with a custom check command needs its own entry
          # here - see the "Known v1 limitation" note in
          # src/foreman/README.md. One pattern per line, read with
          # `read -r` rather than word-split: a pattern containing a
          # space would otherwise split into two patterns that can never
          # match a real path, and this gate would pass silently on
          # exactly the change it exists to block. `*` matches any
          # characters, `/` included, in bash's `[[ ]]` pattern matching.
          PROTECTED_PATHS: |
            check.sh
            .github/workflows/**
          # The ratified answer key (issue #53, Client ruling 2026-08-05):
          # a PR touching either is legitimate but must never merge
          # itself. Same one-pattern-per-line, `read -r` handling as
          # PROTECTED_PATHS above, for the same reason.
          CONTRACT_PROTECTED_PATHS: |
            contract/**
            CONTRACT.md
          # Issue #96: tests define what "correct" means. A changed test
          # file here is cleared only by Inspector's examiner reporting
          # success on this head commit; otherwise it still needs the
          # Client's direct review. This is a temporary stopgap, tracked by
          # github.com/inactdev/fabrica/issues/96, and must be removed when
          # the examiner fully replaces it. It follows the contract pass
          # below so contract tests retain the contract-specific message.
          TEST_PROTECTED_PATHS: |
            *.test.ts
        run: |
          # The API listing needs no checkout at all - GitHub supplies the
          # file list directly from the pull request, which is also the
          # only source that's safe to trust when the workflow definition
          # itself must not depend on anything the PR controls.
          #
          # A pure rename reports as ONE entry: the new filename, plus
          # previous_filename. Emitting only .filename would let a PR
          # rename check.sh away undetected - the same rename-evasion gap
          # this workflow's git-diff predecessor needed --no-renames for.
          # Emitting previous_filename too (when present) closes it here.
          #
          # One tab-separated LINE per entry, deliberately: the line count
          # is then exactly the number of files GitHub listed, which the
          # next block compares against the pull request's own
          # changed_files. That endpoint returns at most 3000 files no
          # matter how many pages are requested, and the truncation is
          # silent - the dropped entries simply never appear, nothing
          # matches, and this gate would report a pass on precisely the
          # change it exists to block. An API error already fails the job
          # (the default `bash -e` shell); a short list must too.
          # per_page=100 is the endpoint's maximum, so the 3000-file cap is
          # reached in 30 requests instead of the 100 the default page size
          # of 30 would take - fewer sequential calls, and less chance of
          # tripping a secondary rate limit and failing an otherwise-fine
          # pull request closed. The cap itself is 3000 files either way.
          touched=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[] | [.filename, (.previous_filename // empty)] | @tsv')

          if [ -z "$touched" ]; then
            listed=0
          else
            listed=$(printf '%s\n' "$touched" | wc -l | tr -d '[:space:]')
          fi

          if [ "$listed" != "$CHANGED_FILES" ]; then
            # The API always returns exactly 3000 entries when it truncates
            # (never fewer), so that exact count plus a genuinely larger
            # CHANGED_FILES is the cap, distinguishable from the other cause
            # this mismatch has: CHANGED_FILES is a snapshot from the event
            # payload, while $listed is fetched live, so a push landing
            # mid-run also makes them disagree - a completely different
            # problem with a completely different fix. Both fail closed
            # either way; only the message differs, and deliberately: no
            # machinery here tries to eliminate the race, since a later run
            # (GitHub reruns checks on every new push) already corrects it.
            if [ "$listed" -eq 3000 ] && [ "$CHANGED_FILES" -gt 3000 ]; then
              echo "::error::Could not read this pull request's complete changed-file list: GitHub listed $listed file(s), but the pull request itself reports $CHANGED_FILES changed. The API caps that listing at 3000 files, so this pull request cannot be checked against the project's protected paths (CONTRACT rule 9). Failing closed rather than passing unchecked - split the pull request into smaller ones, or have the Client review it and deliberately override this check."
            else
              echo "::error::This pull request's changed-file count changed while this check was running (GitHub listed $listed file(s) just now, but this run started when the pull request reported $CHANGED_FILES) - most likely a new commit was pushed mid-run, not a listing problem. Failing closed rather than checking a stale count (CONTRACT rule 9); a fresh run on the latest push resolves this on its own, or the Client can review and deliberately override this check."
            fi
            exit 1
          fi

          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS=$'\t' read -r file previous_file; do
              for candidate in "$file" "$previous_file"; do
                [ -n "$candidate" ] || continue
                if [[ "$candidate" == $pattern ]]; then
                  echo "::error::This pull request touches \"$candidate\", one of the project's own protected checks (CONTRACT rule 9). Changing the thing that decides whether work passes needs the Client's eyes, declared or not. Only the Client may review this and deliberately override this check to merge it."
                  exit 1
                fi
              done
            done <<< "$touched"
          done <<< "$PROTECTED_PATHS"

          # Issue #53 - a contract change, unlike a rule-9 violation, is
          # not wrongdoing: it is allowed, and can be a good idea. What it
          # can never be is self-merged. Worded differently from the loop
          # above on purpose, so the author can tell "you broke a rule"
          # apart from "you changed a rule, and only the Client merges
          # that."
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS=$'\t' read -r file previous_file; do
              for candidate in "$file" "$previous_file"; do
                [ -n "$candidate" ] || continue
                if [[ "$candidate" == $pattern ]]; then
                  echo "::error::This pull request touches \"$candidate\", part of Fabrica's ratified contract (CONTRACT.md / contract/). Changing the contract is allowed - it can be the right call - but it can never merge itself: only the Client reviews and merges a contract change directly, however green everything else is."
                  exit 1
                fi
              done
            done <<< "$touched"
          done <<< "$CONTRACT_PROTECTED_PATHS"

          # Issue #96 deliberately follows the contract loop: contract tests
          # are contract changes first, while every other test change is
          # Inspector's examiner's to clear - and, failing that, the
          # Client's to review.
          #
          # This pass only NAMES the first changed test file; it does not
          # decide. The verdict comes from the examiner's commit status
          # below, and it is read only if something was actually named -
          # a pull request that touches no test at all must never be
          # failed by a hiccup reading a status it has no use for.
          touched_test=""
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS=$'\t' read -r file previous_file; do
              for candidate in "$file" "$previous_file"; do
                [ -n "$candidate" ] || continue
                if [[ "$candidate" == $pattern ]]; then
                  touched_test="$candidate"
                  # Out of all three loops - the `for`, the file loop and
                  # the pattern loop. Every one of them runs in this same
                  # shell (here-strings, not pipes), so the assignment
                  # above survives.
                  break 3
                fi
              done
            done <<< "$touched"
          done <<< "$TEST_PROTECTED_PATHS"

          if [ -n "$touched_test" ]; then
            # The combined-status endpoint already resolves to the latest
            # status per context, so this is the examiner's most recent
            # word on this head commit, not a stale one - the same call
            # and the same reasoning as the inspector-stamp job's.
            #
            # The exit status is captured and branched on explicitly
            # rather than left to `bash -e`: an unreadable status must
            # fail with its own message naming the real problem, and must
            # never be mistaken for the empty output a context that
            # simply posted nothing produces, which means something quite
            # different.
            if ! tests_state=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[]? | select(.context == "inspector-tests") | .state'); then
              echo "::error::Could not read the \"inspector-tests\" status on $HEAD_SHA, so this pull request's change to \"$touched_test\" cannot be cleared by Inspector's examiner (github.com/inactdev/fabrica/issues/96). Failing closed rather than passing an unjudged test change - re-run this check once the API is reachable again, or have the Client review and deliberately override it."
              exit 1
            fi

            if [ "$tests_state" = "success" ]; then
              echo "Inspector's examiner reported success on $HEAD_SHA; this pull request's test changes (first: \"$touched_test\") are cleared."
            elif [ -z "$tests_state" ]; then
              echo "::error::This pull request touches \"$touched_test\", a test change that changes what Fabrica considers correct, and Inspector's examiner has posted no \"inspector-tests\" status on $HEAD_SHA at all. With no judgment to honor, the Client must review and merge this test change directly (github.com/inactdev/fabrica/issues/96)."
              exit 1
            else
              echo "::error::This pull request touches \"$touched_test\", a test change that changes what Fabrica considers correct, and Inspector's examiner reported \"$tests_state\" on $HEAD_SHA rather than success. Only its success clears a test change; otherwise the Client must review and merge it directly (github.com/inactdev/fabrica/issues/96)."
              exit 1
            fi
          fi

          # Reached either because nothing protected was touched at all, or
          # because the only protected thing touched was a test change
          # Inspector's examiner already cleared above.
          echo "No protected path blocks this pull request."

  # "inspector stamp" - a required-status-check gate that relays
  # Inspector's own verdict onto the pull request itself. Inspector posts
  # a commit status named "inspector" on the branch it inspects (its own
  # repository owns that; nothing here posts it) - this job only asks the
  # API for that status on the pull request's head commit and reports it
  # as its own check, so a merge Inspector never saw at all is exactly as
  # visible in branch protection as one it marked red. Same `pull_request_
  # target` trigger (declared once, above, for the whole file) as
  # block-protected-path-change, and the same reason: the job's own
  # definition must come from the base branch, or a pull request could
  # edit this step to report success regardless of what Inspector said.
  # No checkout, ever - only the GitHub API is asked, and only for the
  # head commit's own recorded status.
  inspector-stamp:
    name: inspector stamp
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    steps:
      - name: Relay Inspector's commit status onto this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The combined-status endpoint already resolves to the latest
          # status per context, so there is no need to page through every
          # status this commit has ever received looking for "inspector"'s
          # most recent one.
          state=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '.statuses[]? | select(.context == "inspector") | .state')

          if [ -z "$state" ]; then
            echo "::error::no inspector stamp"
            exit 1
          fi

          if [ "$state" = "success" ]; then
            echo "Inspector reported success on $HEAD_SHA."
            exit 0
          fi

          echo "::error::Inspector reported \"$state\" on $HEAD_SHA - this pull request is not green."
          exit 1
