# CONTRACT rule 9's CI-visible gate. Reads the pull request's OWN diff for
# a touched protected path, rather than trusting any mark Fabrica itself
# writes about the violation. Fabrica's own detection (gate-changes.ts)
# stays in place and still records the outcome honestly in the delivery -
# but that is detection, not enforcement. If it were CI's signal, a bug in
# that detection, or a Worker that evades it, would leave CI looking at an
# ordinary-looking PR and waving it through: the thing being policed would
# be writing its own accusation. Diffing the PR needs nothing from
# Fabrica, so it works the same way for a human contributor's PR as for a
# Worker's, and can't be defeated by Fabrica misbehaving.
#
# This blocks a DECLARED gate change too, not only an undeclared one - a
# change to the thing that decides whether work passes deserves the
# Client's eyes every time, declared or not. Fabrica's own delivery record
# still tells the two apart for the Client's benefit; this check does not
# need to.
#
# A failing check here does not, by itself, block a merge — GitHub only
# enforces that once this workflow's job is marked a required status check
# in the repository's branch protection settings, a manual setting this
# file cannot turn on for you.
#
# The job below deliberately has no job-level `if`. A job an `if` skips
# reports a "skipped" conclusion, and whether GitHub treats "skipped" as
# passing for a *required* status check is a known trap, not a documented
# guarantee. So the job always runs on every pull_request; the diff
# inspection happens inside the one step instead — every run reports a
# real pass or fail, never a skip.
#
# Known limitation (github.com/inactdev/fabrica/issues/55): this workflow
# exists only in Fabrica's own repository. Every other project Fabrica
# manages currently has no gate at all - closing that is issue #55's job,
# not this file's.
name: rule9-gate

on:
  pull_request:

jobs:
  block-protected-path-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no merge-base to diff against. fetch-depth: 0
          # pulls full history so the comparison below is against the
          # pull request's real base, not a guess.
          fetch-depth: 0

      - name: Block merge — protected path touched (CONTRACT rule 9)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Matches what src/foreman/gate-changes.ts watches today (the
          # check.sh convention only). A project registered with a custom
          # check command needs its own list here - see the "Known v1
          # limitation" note in src/foreman/README.md.
          PROTECTED_PATHS: "check.sh"
        run: |
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          touched=$(git diff --no-renames --name-only "$merge_base" "$HEAD_SHA")

          for path in $PROTECTED_PATHS; do
            if grep -qxF "$path" <<< "$touched"; then
              echo "::error::This pull request touches \"$path\", one of the project's own protected checks (CONTRACT rule 9). Changing the thing that decides whether work passes needs the Client's eyes, declared or not. Only the Client may review this and deliberately override this check to merge it."
              exit 1
            fi
          done
          echo "No protected path touched."
